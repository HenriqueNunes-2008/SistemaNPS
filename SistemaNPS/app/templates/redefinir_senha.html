<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir Senha</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-start: #0f87e9;
            --bg-end: #202677;
            --card-bg: linear-gradient(135deg, #7c90c2, #2c53d4);
            --text-dark: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.78);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Montserrat", sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(90deg, var(--bg-start), var(--bg-end));
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: var(--text-dark);
        }

        .card {
            width: min(560px, 96vw);
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.2);
            padding: 36px;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 12px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 16px;
        }

        .password-field {
            position: relative;
        }

        label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
        }

        input {
            height: 46px;
            border: none;
            border-bottom: 2px solid rgba(255, 255, 255, 0.8);
            background: transparent;
            color: #fff;
            outline: none;
            font-size: 14px;
            padding: 0 6px;
        }

        .password-field input {
            padding-right: 44px;
        }

        button {
            height: 46px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(90deg, #1f4bbd, #7c42e5);
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            margin-top: 6px;
        }

        .toggle-password {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            width: 32px;
            height: 32px;
            border: none;
            background: transparent;
            color: rgba(255, 255, 255, 0.9);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            margin: 0;
        }

        .toggle-password:hover {
            color: #ffffff;
        }

        .toggle-password .eye-off {
            display: none;
        }

        .toggle-password[data-visible="true"] .eye {
            display: none;
        }

        .toggle-password[data-visible="true"] .eye-off {
            display: inline;
        }

        .feedback {
            margin-bottom: 14px;
            font-size: 13px;
            font-weight: 600;
            color: #ffd0d0;
        }

        .token-warning {
            margin: 0 0 14px;
            font-size: 12px;
            color: #ffe6a6;
            display: none;
        }

        .links {
            margin-top: 16px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .links a {
            color: #fff;
            font-weight: 700;
            text-decoration: none;
        }

        .links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <main class="card">
        <h1>Criar nova senha</h1>
        <p class="subtitle">
            Defina uma nova senha para sua conta e volte ao login.
        </p>

        {% if erro %}
            <p class="feedback">{{ erro }}</p>
        {% endif %}

        <p id="token-warning" class="token-warning">
            Link invalido ou expirado. Solicite um novo email de recuperacao.
        </p>

        <form id="reset-form" method="post" action="/redefinir-senha">
            <input type="hidden" id="access_token" name="access_token" value="{{ access_token or '' }}">
            <input type="hidden" id="refresh_token" name="refresh_token" value="{{ refresh_token or '' }}">
            <input type="hidden" id="project_token" name="project_token" value="{{ project_token or '' }}">

            <div class="input-group">
                <label for="password">Nova senha</label>
                <div class="password-field">
                    <input id="password" name="password" type="password" minlength="6" required>
                    <button class="toggle-password" type="button" data-target="password" data-visible="false" aria-label="Mostrar senha">
                        <svg class="eye" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                        <svg class="eye-off" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 3l18 18"></path>
                            <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"></path>
                            <path d="M9.36 5.37A10.94 10.94 0 0 1 12 5c6.5 0 10 7 10 7a13.16 13.16 0 0 1-3.23 4.19"></path>
                            <path d="M6.53 6.53C4.35 8 3 12 3 12a13.4 13.4 0 0 0 5 5.5"></path>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="input-group">
                <label for="password_confirm">Confirmar nova senha</label>
                <div class="password-field">
                    <input id="password_confirm" name="password_confirm" type="password" minlength="6" required>
                    <button class="toggle-password" type="button" data-target="password_confirm" data-visible="false" aria-label="Mostrar senha">
                        <svg class="eye" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                        <svg class="eye-off" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 3l18 18"></path>
                            <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"></path>
                            <path d="M9.36 5.37A10.94 10.94 0 0 1 12 5c6.5 0 10 7 10 7a13.16 13.16 0 0 1-3.23 4.19"></path>
                            <path d="M6.53 6.53C4.35 8 3 12 3 12a13.4 13.4 0 0 0 5 5.5"></path>
                        </svg>
                    </button>
                </div>
            </div>

            <button type="submit">ATUALIZAR SENHA</button>
        </form>

        <p class="links">
            Voltar para o <a href="/login{% if project_token %}?project_token={{ project_token }}{% endif %}">LOGIN</a>.
        </p>
    </main>

    <script>
        (function () {
            const accessInput = document.getElementById("access_token");
            const refreshInput = document.getElementById("refresh_token");
            const projectTokenInput = document.getElementById("project_token");
            const warning = document.getElementById("token-warning");

            function readParams(source) {
                if (!source) return new URLSearchParams();
                return new URLSearchParams(source);
            }

            const hashParams = readParams(window.location.hash.replace(/^#/, ""));
            const queryParams = readParams(window.location.search.replace(/^\?/, ""));

            const accessToken =
                hashParams.get("access_token") ||
                queryParams.get("access_token") ||
                accessInput.value;
            const refreshToken =
                hashParams.get("refresh_token") ||
                queryParams.get("refresh_token") ||
                refreshInput.value;
            const projectToken = queryParams.get("project_token") || projectTokenInput.value;

            accessInput.value = accessToken || "";
            refreshInput.value = refreshToken || "";
            projectTokenInput.value = projectToken || "";

            if (!accessToken || !refreshToken) {
                warning.style.display = "block";
            }

            if (window.location.hash) {
                history.replaceState(null, "", window.location.pathname + window.location.search);
            }

            const toggles = document.querySelectorAll(".toggle-password");
            toggles.forEach((btn) => {
                btn.addEventListener("click", function () {
                    const targetId = this.getAttribute("data-target");
                    const input = document.getElementById(targetId);
                    if (!input) return;
                    const visible = input.type === "text";
                    input.type = visible ? "password" : "text";
                    this.setAttribute("data-visible", visible ? "false" : "true");
                    this.setAttribute("aria-label", visible ? "Mostrar senha" : "Ocultar senha");
                });
            });
        })();
    </script>
</body>
</html>
