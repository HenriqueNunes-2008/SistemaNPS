<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Termo de Aceite</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<style> 
    .subtitle {
        border-radius: 999px;
    }
  
</style>
<body>
    <!-- LADO ESQUERDO -->

        <img src="/static/npsimagem.png" id="npsimg" class="tablet-img" alt="Imagem de tablet">
    <!-- LADO DIREITO -->
    <div class="right">
        <h2 class="title">TERMO DE ACEITE E<br>ENTREGA DE SERVIÇOS</h2>
        <h3 class="subtitle">UNIDADES MÓVEIS</h3>

        <div class="buttons-container">
            <a href="/termo{% if project_token %}?project_token={{ project_token }}{% endif %}" class="option green-box">
    <img src="/static/check-white.png" class="icone">
    <span>Termo de aceite</span>
</a>

<a href="/ressalvas{% if project_token %}?project_token={{ project_token }}{% endif %}" class="option blue-box">
    <img src="/static/check-blue.png" class="icone">
    <span>Ressalva</span>
</a>

<a id="npsOption" href="/nps{% if project_token %}?project_token={{ project_token }}{% endif %}" class="option orange-box">
    <img src="/static/check-orange.png" class="icone">
    <span>NPS</span>
</a>

        </div>
    </div>

    <img id="logo" src="/static/LogoFlex.png" class="logo1">

    <img id="Logo" src="/static/LogoFlex2.png" class="logo2">

    <img id="Logo3" src="/static/LogoFlex3.png" class="logo3">
    <script>
        (function () {
            const cookies = document.cookie ? document.cookie.split(";") : [];
            let flow = "cliente";
            for (const rawCookie of cookies) {
                const cookie = rawCookie.trim();
                if (cookie.startsWith("nps_tipo_acesso=")) {
                    flow = decodeURIComponent(cookie.split("=", 2)[1] || "").toLowerCase();
                    break;
                }
            }
            if (flow === "motorista") {
                const npsOpt = document.getElementById("npsOption");
                if (npsOpt) npsOpt.style.display = "none";
            }
        })();
    </script>
</body>
</html>
