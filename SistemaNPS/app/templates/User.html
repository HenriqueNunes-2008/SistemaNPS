<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Acesso ao Sistema</title>
<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    font-family: Arial, sans-serif;
    position: relative;
    overflow: hidden;
    color: #ffffff;
}

.bg {
    position: fixed;
    inset: 0;
    background:
        linear-gradient(120deg, rgba(0, 147, 221, 0.85), rgba(91, 47, 166, 0.85)),
        url("/static/npsimagem.png") center/cover no-repeat;
    filter: blur(8px);
    transform: scale(1.05);
}

.overlay {
    position: fixed;
    inset: 0;
    background: rgba(9, 17, 42, 0.35);
}

.wrapper {
    position: relative;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
}

.card {
    width: 100%;
    max-width: 780px;
    background: rgba(255, 255, 255, 0.16);
    border: 1px solid rgba(255, 255, 255, 0.38);
    border-radius: 20px;
    padding: 34px 30px;
    backdrop-filter: blur(6px);
    text-align: center;
}

.title {
    font-size: 30px;
    font-weight: 800;
    margin-bottom: 12px;
    letter-spacing: 0.3px;
}

.message {
    font-size: 19px;
    line-height: 1.6;
    font-weight: 600;
}

@media (max-width: 768px) {
    .card {
        padding: 26px 20px;
    }

    .title {
        font-size: 24px;
    }

    .message {
        font-size: 17px;
    }
}
</style>
</head>
<body>
    <div class="bg" aria-hidden="true"></div>
    <div class="overlay" aria-hidden="true"></div>

    <main class="wrapper">
        <section class="card">
            <h1 class="title">Acesso Restrito</h1>
            <p class="message">
                {{ mensagem_acesso or "Para acessar o sistema, entre pelo link que o Representante da Fleximedical/Kure enviara para voce." }}
            </p>
        </section>
    </main>
</body>
</html>
