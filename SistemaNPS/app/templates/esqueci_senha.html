<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esqueci Minha Senha</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-start: #0f87e9;
            --bg-end: #202677;
            --card-bg: linear-gradient(135deg, #7c90c2, #2c53d4);
            --text-dark: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.78);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Montserrat", sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(90deg, var(--bg-start), var(--bg-end));
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: var(--text-dark);
        }

        .card {
            width: min(560px, 96vw);
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.2);
            padding: 36px;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 12px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 18px;
        }

        label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
        }

        input {
            height: 46px;
            border: none;
            border-bottom: 2px solid rgba(255, 255, 255, 0.8);
            background: transparent;
            color: #fff;
            outline: none;
            font-size: 14px;
            padding: 0 6px;
        }

        button {
            height: 46px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(90deg, #1f4bbd, #7c42e5);
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            margin-top: 4px;
        }

        .feedback {
            margin-bottom: 14px;
            font-size: 13px;
            font-weight: 600;
        }

        .feedback.error {
            color: #ffd0d0;
        }

        .feedback.success {
            color: #d7ffe0;
        }

        .links {
            margin-top: 16px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .links a {
            color: #fff;
            font-weight: 700;
            text-decoration: none;
        }

        .links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <main class="card">
        <h1>Esqueci minha senha</h1>
        <p class="subtitle">
            Informe seu email cadastrado. Se ele existir, voce recebera um link para criar uma nova senha.
        </p>

        {% if erro %}
            <p class="feedback error">{{ erro }}</p>
        {% endif %}
        {% if sucesso %}
            <p class="feedback success">{{ sucesso }}</p>
        {% endif %}

        <form method="post" action="{{ form_action or '/esqueci-senha' }}">
            <input type="hidden" name="project_token" value="{{ project_token or '' }}">
            <input type="hidden" name="admin_mode" value="{{ '1' if admin_mode else '0' }}">
            <div class="input-group">
                <label for="email">Email cadastrado</label>
                <input id="email" name="email" type="email" placeholder="seu@email.com" required>
            </div>
            <button type="submit">ENVIAR LINK DE RECUPERACAO</button>
        </form>

        <p class="links">
            Voltar para o <a href="{{ login_url or ('/login' ~ ('?project_token=' ~ project_token if project_token else '')) }}">LOGIN</a>.
        </p>
    </main>
</body>
</html>
