<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Admin - Sistema NPS</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&amp;display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-start: #0f87e9;
            --bg-end: #202677;
            --card-bg: linear-gradient(135deg, #7c90c2, #2c53d4);
            --text-dark: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.75);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Montserrat", sans-serif; }
        body {
            min-height: 100vh;
            background: linear-gradient(90deg, var(--bg-start), var(--bg-end));
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 160px 16px 32px;
            color: var(--text-dark);
        }
        .topbar {
            position: fixed; top: 0; left: 0; width: 100%; height: 120px;
            background: #ffffff; z-index: 40; box-shadow: 0 2px 8px rgba(0,0,0,.08); border-radius: 0 0 50px 50px;
        }
        .logo-fixed { position: absolute; top: 50%; left: 1%; transform: translateY(-50%); height: 255%; pointer-events: none; }
        .logo-link { position: absolute; top: 50%; left: calc(1% + 85px); transform: translateY(-50%); width: 190px; height: 50px; z-index: 45; display: block; }
        .topbar-content { height: 100%; display: flex; align-items: center; justify-content: flex-end; padding: 0 60px 0 200px; }
        .header-info { display: flex; gap: 32px; font-size: 14px; margin-right: 5%; color: #1e3a8a; line-height: 1.4; }
        .card {
            width: min(500px, 90vw); background: var(--card-bg); border-radius: 28px; padding: 48px;
            box-shadow: 0 18px 45px rgba(0,0,0,.18); text-align: center;
        }
        .title { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
        .subtitle { color: var(--text-muted); font-size: 16px; margin-bottom: 32px; }
        input { width: 100%; height: 50px; border: none; border-radius: 12px; padding: 0 20px; font-size: 16px; margin-bottom: 20px; }
        button {
            width: 100%; height: 50px; border: none; border-radius: 12px;
            background: linear-gradient(90deg, #1f4bbd, #7c42e5); color: #fff; font-size: 16px; font-weight: 700; cursor: pointer;
        }
        button:hover { background: linear-gradient(90deg, #1a3f9f, #6735c7); }
        .error { color: #ffd0d0; margin-top: 12px; font-size: 14px; }
        @media (max-width: 768px) { body { padding-top: 150px; } .topbar { height: 100px; border-radius: 0 0 32px 32px; } }
    </style>
</head>
<body>
    <div class="topbar">
        <img src="/static/LogoFlexcolor2.png" class="logo-fixed" alt="Logo">
        <a href="/" class="logo-link" aria-label="Página inicial"></a>
        <div class="topbar-content">
            <div class="header-info">
                <div>R. José Antônio Valadares, 285 – Vila Liviero<br>São Paulo – SP. CEP: 04185-020</div>
                <div>comercial@soukure.com.br<br>(11) 2372-7444</div>
            </div>
        </div>
    </div>

    <div class="card">
        <h1 class="title">Acesso Restrito</h1>
        <p class="subtitle">Digite a senha de acesso para preencher o termo</p>
        <form method="POST" action="/admin-password">
            <input type="password" name="password" placeholder="Senha de acesso" required autofocus>
            <button type="submit">ACESSAR ADMIN</button>
        </form>
        <div class="error" id="error" style="display:none;"></div>
    </div>

    <script>
        // Handle POST via fetch se quiser feedback, mas simples form OK
    </script>
</body>
</html>
